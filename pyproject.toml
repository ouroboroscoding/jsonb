[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "jsonb"
version = "1.0.1"
description = "JSON Better - A Python Library Used to simplify encoding/decoding JSON while handling special types"
keywords = [ "json" ]
authors = [
	{ name = "Chris Nasr - Ouroboros Coding Inc.", email = "chris@ouroboroscoding.com" }
]
maintainers = [
	{ name = "Chris Nasr - Ouroboros Coding Inc.", email = "chris@ouroboroscoding.com" }
]
license-files = [ "LICENSE" ]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Source = "https://github.com/ouroboroscoding/jsonb"
Tracker = "https://github.com/ouroboroscoding/jsonb/issues"

[tool.hatch.build]
packages = [ "jsonb" ]